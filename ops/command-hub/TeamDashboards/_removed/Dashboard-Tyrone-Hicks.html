<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Center</title>

  <!-- =====================================================================
       HOW TO MAKE A NEW DASHBOARD FOR SOMEONE  (takes ~30 seconds)
       ---------------------------------------------------------------------
       1. Copy this file and rename it, e.g.  Dashboard-Sara.html
       2. Scroll down to the  ==== PROFILE ====  block near the bottom.
       3. Change just THREE things:
            name:  their first name      (e.g. "Sara")
            role:  pick ONE from this list:
                   owner | manager | dispatch | operator | sales
                   family | friend | vendor
            subtitle: the line under their name (optional)
       4. (Optional) add personal links just for them in  extraTiles.
       5. Save. Send them the file. Done — they only see what their role allows.

       Roles, from most access to least:
         owner    = you. Sees EVERYTHING (admin, money, infra).
         manager  = trusted lead. Operations + Billing. No infra/keys.
         dispatch = office/coordination. Dispatch, Cases, conversations.
         operator = field/detailer. Dispatch, Cases, schedule, assistant.
         sales    = CRM/pipeline. GoHighLevel + Intake.
         family / friend / vendor = personal links only (no business tiles).
       ===================================================================== -->

  <style>
    :root {
      --bg: #0a0f1a;
      --bg2: #0f1729;
      --card: #161f33;
      --card-hover: #1d2a45;
      --border: rgba(255,255,255,0.07);
      --text: #f5f7fb;
      --muted: #8a98b5;
      --accent: #4f8cff;        /* set per-person from the PROFILE block */
      --green: #3ddc97;
      --amber: #ffc24b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at top, var(--bg2) 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem 1.25rem 3rem;
    }

    /* ---------- Header ---------- */
    header { text-align: center; max-width: 1080px; margin: 0 auto 2rem; }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
    header .sub { color: var(--muted); margin-top: 0.4rem; font-size: 1rem; }
    .meta { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .badge {
      padding: 0.35rem 0.85rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
      border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--muted);
    }
    .badge.live { color: var(--green); border-color: rgba(61,220,151,0.3); }

    /* ---------- Voice button ---------- */
    .voice-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.65rem; margin-top: 1.5rem; }
    #mic {
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      width: 100%; max-width: 420px; padding: 1.1rem 1.5rem;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      border-radius: 999px;
      background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 24%, transparent), color-mix(in srgb, var(--accent) 14%, transparent));
      color: var(--text); font-size: 1.2rem; font-weight: 700; cursor: pointer;
      transition: transform 0.12s, box-shadow 0.18s, background 0.18s;
    }
    #mic:hover, #mic:active { transform: translateY(-2px); box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 32%, transparent); }
    #mic .mic-icon { font-size: 1.6rem; line-height: 1; }
    #mic.listening {
      background: linear-gradient(145deg, rgba(61,220,151,0.3), rgba(79,140,255,0.18));
      border-color: rgba(61,220,151,0.6);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(61,220,151,0.45); }
      50% { box-shadow: 0 0 0 14px rgba(61,220,151,0); }
    }
    #voice-status { min-height: 1.3rem; font-size: 1rem; color: var(--muted); text-align: center; transition: color 0.2s; }
    #voice-status.ok { color: var(--green); }
    #voice-status.warn { color: var(--amber); }
    .hf-toggle {
      margin-top: 0.2rem; padding: 0.45rem 1rem; border-radius: 999px;
      border: 1px solid var(--border); background: rgba(255,255,255,0.04);
      color: var(--muted); font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: color 0.18s, border-color 0.18s, background 0.18s;
    }
    .hf-toggle.on { color: var(--green); border-color: rgba(61,220,151,0.5); background: rgba(61,220,151,0.1); }

    /* ---------- Sections + tiles ---------- */
    section { max-width: 1080px; margin: 0 auto 2rem; }
    section h2 { font-size: 0.95rem; font-weight: 600; color: var(--muted); margin-bottom: 0.85rem; padding-left: 0.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.9rem; }
    a.tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6rem;
      padding: 1.5rem 0.75rem; background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; color: var(--text); text-decoration: none;
      font-size: 1.05rem; font-weight: 600; text-align: center; min-height: 130px;
      transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
    }
    a.tile:hover, a.tile:active { background: var(--card-hover); transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
    .icon { font-size: 2.6rem; line-height: 1; }
    .small { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
    .grid.big { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    a.tile.primary {
      background: var(--card);
      background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 30%, transparent), color-mix(in srgb, var(--accent) 16%, transparent));
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      min-height: 160px; font-size: 1.3rem;
    }
    a.tile.primary .icon { font-size: 3.2rem; }
    a.tile.ghl:hover, a.tile.ghl:active { box-shadow: 0 12px 30px rgba(255,194,75,0.18); }

    footer {
      max-width: 1080px; margin: 2.5rem auto 0; padding-top: 1.25rem;
      border-top: 1px solid var(--border); font-size: 0.82rem; color: var(--muted);
      text-align: center; line-height: 1.6;
    }
    @media (max-width: 600px) {
      header h1 { font-size: 1.6rem; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 0.7rem; }
      a.tile { min-height: 115px; padding: 1.2rem 0.5rem; font-size: 0.95rem; }
      .icon { font-size: 2.2rem; }
      a.tile.primary { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="greeting">Command Center</h1>
    <p class="sub" id="subtitle">AIXMOS · TMMT</p>
    <div class="meta">
      <span class="badge live">● Live</span>
      <span class="badge" id="clock">—</span>
    </div>
    <div class="voice-wrap">
      <button id="mic" type="button">
        <span class="mic-icon">🎙️</span>
        <span id="mic-label">Tap &amp; speak</span>
      </button>
      <div id="voice-status">Say a page name, or “ask … ” a question</div>
      <button id="handsfree" type="button" class="hf-toggle">🔇 Hands-free: off</button>
    </div>
  </header>

  <main id="sections"><!-- tiles are generated by the script below --></main>

  <footer id="footer"></footer>

  <script>
  /* =====================================================================
     PROFILE  —  EDIT THIS BLOCK TO MAKE A DASHBOARD FOR SOMEONE
     ===================================================================== */
  var PROFILE = {
    name: "Tyrone",                 // their first name (used in the greeting)
    role: "operator",              // owner | manager | dispatch | operator | sales | family | friend | vendor
    subtitle: "TMMT · Detailer",     // small line under the name
    accent: "",                    // optional theme color, e.g. "#3ddc97". Leave "" to use the role color.

    // Optional: personal links just for this person. Shown at the top.
    // Example: { icon: "📅", label: "Our Calendar", sub: "shared", href: "https://..." }
    extraTiles: [
      // { icon: "🔗", label: "Example link", sub: "edit me", href: "https://example.com" },
    ],
  };
  /* ============================ END PROFILE ============================ */


  /* ===== Tile catalog (shared by every dashboard). Each tile lists which
     roles may see it. 'owner' always sees everything. You normally never
     need to edit below this line. ===== */
  var ROLE_ACCENT = {
    owner: "#4f8cff", manager: "#b794ff", dispatch: "#4f8cff", operator: "#3ddc97",
    sales: "#ffc24b", family: "#ff8fab", friend: "#5ad1e6", vendor: "#ffa94d"
  };
  var STAFF = ["owner","manager","dispatch","operator","sales"];

  var TMMT = "https://tmmt-ops.vercel.app";
  var GHL  = "https://app.gohighlevel.com";
  var LOC  = "Xcd8DZt5T4GWnBtBEC5V";        // TMMT Rentals GHL location
  var LOC2 = "EaRPXFwPZbqCM9pynHwt";        // Restoration / LTO GHL location

  var SECTIONS = [
    { title: "⭐ Start here", big: true, tiles: [
      { icon:"📋", label:"Morning Briefing", sub:"your daily dashboard", href:TMMT+"/internal/briefing", primary:true, say:"briefing, morning, daily, brief, today", roles:["manager","dispatch","operator","sales"] },
      { icon:"⬡", label:"TMMT Ops", sub:"full command center", href:TMMT+"/internal/dashboard", primary:true, say:"ops, command, dashboard, home, command center", roles:["manager"] },
    ]},
    { title: "🏢 TMMT operations", tiles: [
      { icon:"🚀", label:"Dispatch", href:TMMT+"/internal/dispatch", roles:["manager","dispatch","operator"] },
      { icon:"📁", label:"Cases", href:TMMT+"/internal/cases", roles:["manager","dispatch","operator"] },
      { icon:"🏢", label:"Agency", href:TMMT+"/internal/agency", roles:["manager","dispatch"] },
      { icon:"👥", label:"Operators", href:TMMT+"/internal/operators", roles:["manager","dispatch"] },
      { icon:"🛒", label:"Marketplace", href:TMMT+"/internal/marketplace", roles:["manager","sales"] },
      { icon:"🚗", label:"Dealer", href:TMMT+"/internal/dealer", roles:["manager"] },
      { icon:"💳", label:"Billing", href:TMMT+"/internal/billing", roles:["manager"] },
      { icon:"📈", label:"Investor", href:TMMT+"/investor/dashboard", roles:[] },        // owner only
      { icon:"📥", label:"Intake", href:TMMT+"/intake", roles:["manager","dispatch","sales","vendor"] },
      { icon:"💻", label:"Local dev", href:"http://localhost:3000/internal/briefing", roles:[] },
    ]},
    { title: "📞 GoHighLevel", tiles: [
      { icon:"🏠", label:"TMMT Rentals", sub:"main pipeline", href:GHL+"/v2/location/"+LOC+"/launchpad", ghl:true, say:"rentals, tmmt rentals, pipeline", roles:["manager","sales"] },
      { icon:"🔧", label:"Restoration", sub:"credit journey", href:GHL+"/v2/location/"+LOC2+"/launchpad", ghl:true, say:"restoration, credit, lto, repair", roles:["manager","sales"] },
      { icon:"💬", label:"Conversations", href:GHL+"/v2/location/"+LOC+"/conversations/conversations", ghl:true, roles:["manager","dispatch","sales"] },
      { icon:"📅", label:"Calendar", href:GHL+"/v2/location/"+LOC+"/calendars/view", ghl:true, roles:["manager","dispatch","sales","operator"] },
      { icon:"👤", label:"Contacts", href:GHL+"/v2/location/"+LOC+"/contacts/smart_list/All", ghl:true, roles:["manager","sales"] },
      { icon:"📞", label:"GHL Home", href:GHL+"/", ghl:true, roles:["manager","sales"] },
    ]},
    { title: "🛠 AIXMOS stack", tiles: [
      { icon:"▲", label:"Vercel", href:"https://vercel.com/aixmos537", roles:[] },
      { icon:"🗄", label:"Supabase", href:"https://supabase.com/dashboard/project/uapxakmlwnpfsftfeezx", roles:[] },
      { icon:"💰", label:"Stripe", href:"https://dashboard.stripe.com/", roles:[] },
      { icon:"📝", label:"Notion", href:"https://www.notion.so/", roles:["manager"] },
      { icon:"💼", label:"Slack", href:"https://app.slack.com/client", roles:["manager","dispatch"] },
      { icon:"⌥", label:"GitHub", href:"https://github.com/", roles:[] },
    ]},
    { title: "🤖 AI &amp; build", tiles: [
      { icon:"✦", label:"Cursor IDE", href:"cursor://file/C:/Users/AIXMOS/CommandCenter/CEO-Dashboard.html", target:false, roles:[] },
      { icon:"🤖", label:"TMMT Assistant", href:TMMT+"/internal/assistant", say:"assistant, ai, help", roles:["manager","dispatch","operator","sales"] },
      { icon:"🌐", label:"Alt deploy", href:"https://tmmt-c919-two.vercel.app", roles:[] },
    ]},
    { title: "👋 Personal", tiles: [
      { icon:"✉️", label:"Message Muhammad", sub:"email", href:"mailto:tmmtautodetail@gmail.com", target:false, roles:["family","friend","vendor"], ownerHide:true },
    ]},
  ];

  /* ===== Renderer ===== */
  (function render() {
    var role = (PROFILE.role || "operator").toLowerCase();
    var accent = PROFILE.accent || ROLE_ACCENT[role] || ROLE_ACCENT.operator;
    document.documentElement.style.setProperty('--accent', accent);
    document.getElementById('subtitle').textContent = PROFILE.subtitle || '';

    function visible(t) {
      if (role === 'owner') return !t.ownerHide;
      return t.roles && t.roles.indexOf(role) !== -1;
    }
    function tileHTML(t) {
      var cls = 'tile' + (t.primary ? ' primary' : '') + (t.ghl ? ' ghl' : '');
      var tgt = (t.target === false) ? '' : ' target="_blank" rel="noopener"';
      var say = t.say ? ' data-say="' + t.say + '"' : '';
      var sub = t.sub ? '<span class="small">' + t.sub + '</span>' : '';
      return '<a class="' + cls + '" href="' + t.href + '"' + tgt + say + '>' +
             '<span class="icon">' + t.icon + '</span>' + t.label + sub + '</a>';
    }
    function sectionHTML(title, tiles, big) {
      if (!tiles.length) return '';
      return '<section><h2>' + title + '</h2><div class="grid' + (big ? ' big' : '') + '">' +
             tiles.map(tileHTML).join('') + '</div></section>';
    }

    var html = '';
    // Personal "Your links" first, if any.
    var extras = (PROFILE.extraTiles || []).filter(function (t) { return t && t.href; });
    if (extras.length) html += sectionHTML('⭐ Your links', extras, extras.length <= 2);
    // Catalog sections, filtered by role.
    SECTIONS.forEach(function (s) {
      html += sectionHTML(s.title, s.tiles.filter(visible), s.big);
    });
    document.getElementById('sections').innerHTML = html;

    document.getElementById('footer').innerHTML =
      'AIXMOS · TMMT · Production: tmmt-ops.vercel.app<br />Personal dashboard for ' +
      (PROFILE.name || 'you') + ' · role: ' + role;
  })();

  /* ===== Greeting + clock ===== */
  (function () {
    var h = new Date().getHours();
    var greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    document.getElementById('greeting').textContent = greet + ', ' + (PROFILE.name || 'there');
    function tick() {
      document.getElementById('clock').textContent =
        new Date().toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }
    tick();
    setInterval(tick, 30000);
  })();

  /* ===== Voice control ===== */
  (function () {
    var ASSISTANT_URL = 'https://tmmt-ops.vercel.app/internal/assistant';
    var ASK_PREFIXES = ['ask ', 'assistant ', 'hey assistant ', 'question '];
    var WAKE_WORDS = ['command', 'computer', 'hey command', 'okay command'];
    var QUESTION_STARTERS = /^(what|when|where|why|who|how|which|is|are|can|could|should|do|does|did|will|would|tell me|show me)\b/;
    var isStaff = STAFF.indexOf((PROFILE.role || '').toLowerCase()) !== -1;

    var mic = document.getElementById('mic');
    var label = document.getElementById('mic-label');
    var status = document.getElementById('voice-status');
    var hfBtn = document.getElementById('handsfree');
    function setStatus(msg, cls) { status.textContent = msg; status.className = cls || ''; }

    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      mic.disabled = true; mic.style.opacity = 0.5; mic.style.cursor = 'not-allowed';
      hfBtn.style.display = 'none';
      setStatus('Voice needs Microsoft Edge or Chrome on this device', 'warn');
      return;
    }

    function cleanLabel(tile) {
      var clone = tile.cloneNode(true);
      clone.querySelectorAll('.icon, .small').forEach(function (n) { n.remove(); });
      return clone.textContent.trim().toLowerCase();
    }
    var tiles = Array.prototype.map.call(document.querySelectorAll('a.tile'), function (t) {
      var words = cleanLabel(t).split(/\s+/).filter(Boolean);
      var extra = (t.getAttribute('data-say') || '').toLowerCase().split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      return { el: t, name: cleanLabel(t), keywords: words.concat(extra) };
    });

    function findMatch(said) {
      said = said.toLowerCase().trim();
      for (var i = 0; i < tiles.length; i++) {
        if (said === tiles[i].name || said.indexOf(tiles[i].name) !== -1 || tiles[i].name.indexOf(said) !== -1) return tiles[i];
      }
      var spoken = said.split(/\s+/).filter(Boolean);
      var best = null, bestScore = 0;
      tiles.forEach(function (t) {
        var score = 0;
        t.keywords.forEach(function (k) {
          spoken.forEach(function (w) {
            if (w.length > 2 && (w === k || k.indexOf(w) !== -1 || w.indexOf(k) !== -1)) score++;
          });
        });
        if (score > bestScore) { bestScore = score; best = t; }
      });
      return bestScore > 0 ? best : null;
    }
    function openHref(el) {
      if (el.target === '_blank') { window.open(el.href, '_blank', 'noopener'); }
      else { window.location.href = el.href; }
    }
    function webSearch(q) {
      setStatus('Searching the web for “' + q + '”', 'warn');
      window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank', 'noopener');
    }
    function askAssistant(q) {
      if (!isStaff) { webSearch(q); return; }
      setStatus('Asking the Assistant: “' + q + '” …', 'ok');
      if (navigator.clipboard) { navigator.clipboard.writeText(q).catch(function () {}); }
      window.open(ASSISTANT_URL + '?q=' + encodeURIComponent(q), '_blank', 'noopener');
    }
    function handleCommand(raw) {
      var said = (raw || '').toLowerCase().trim();
      if (!said) return;
      for (var i = 0; i < ASK_PREFIXES.length; i++) {
        if (said.indexOf(ASK_PREFIXES[i]) === 0) { askAssistant(said.slice(ASK_PREFIXES[i].length).trim() || said); return; }
      }
      var m = findMatch(said);
      if (m) { setStatus('Opening “' + m.name + '” …', 'ok'); openHref(m.el); return; }
      if (QUESTION_STARTERS.test(said)) { askAssistant(said); return; }
      webSearch(said);
    }
    function stripWake(said) {
      said = said.toLowerCase().trim();
      for (var i = 0; i < WAKE_WORDS.length; i++) {
        var w = WAKE_WORDS[i];
        if (said === w) return '';
        if (said.indexOf(w + ' ') === 0) return said.slice(w.length).trim();
      }
      return null;
    }

    var rec = new SR();
    rec.lang = 'en-US';
    rec.maxAlternatives = 3;
    var handsFree = false, active = false;
    function applyMode() { rec.continuous = handsFree; rec.interimResults = handsFree; }

    rec.onstart = function () {
      active = true; mic.classList.add('listening');
      if (handsFree) { label.textContent = 'Hands-free on'; setStatus('Listening for “command …”', 'ok'); }
      else { label.textContent = 'Listening…'; setStatus('Speak now', 'ok'); }
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        handsFree = false; updateHfBtn(); setStatus('Microphone blocked — allow mic access for this page', 'warn');
      } else if (e.error === 'no-speech' && !handsFree) { setStatus('Didn’t catch that — tap and try again', 'warn'); }
    };
    rec.onend = function () {
      active = false; mic.classList.remove('listening');
      if (handsFree) { try { rec.start(); } catch (err) {} }
      else { label.textContent = 'Tap & speak'; }
    };
    rec.onresult = function (e) {
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (!e.results[i].isFinal) continue;
        var alts = e.results[i];
        if (handsFree) {
          for (var a = 0; a < alts.length; a++) {
            var cmd = stripWake(alts[a].transcript);
            if (cmd !== null) { if (cmd) handleCommand(cmd); else setStatus('Yes? Say a page or a question', 'ok'); return; }
          }
        } else { handleCommand(alts[0].transcript); return; }
      }
    };

    mic.addEventListener('click', function () {
      if (handsFree) { setStatus('Hands-free is on — just say “command …”', 'ok'); return; }
      if (active) { rec.stop(); return; }
      applyMode();
      try { rec.start(); } catch (err) {}
    });
    function updateHfBtn() {
      hfBtn.classList.toggle('on', handsFree);
      hfBtn.textContent = handsFree ? '🎧 Hands-free: on' : '🔇 Hands-free: off';
    }
    hfBtn.addEventListener('click', function () {
      handsFree = !handsFree; updateHfBtn();
      if (handsFree) { if (active) { try { rec.stop(); } catch (e) {} } applyMode(); try { rec.start(); } catch (err) {} }
      else { try { rec.stop(); } catch (err) {} setStatus('Hands-free off — tap the mic to talk', ''); }
    });
  })();
  </script>
</body>
</html>
