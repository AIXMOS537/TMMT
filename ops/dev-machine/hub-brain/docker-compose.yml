# TMMT AI Brain — run on 24/7 Windows home PC (Docker Desktop required).
# Ollama runs natively on Windows (GPU) — not in this compose file.
# Start: docker compose --env-file .env up -d

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Chicago}
    volumes:
      - n8n-data:/home/node/.n8n
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  open-webui-data:
  n8n-data:
