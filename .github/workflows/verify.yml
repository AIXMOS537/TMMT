name: Verify (local-first gate)

# The server-side backstop to the local gate (scripts/verify.sh): lint + unit
# tests + production build on every PR and every push to master. Make this a
# REQUIRED status check on master (branch protection) and broken code can never
# land — so any deploy from master is inherently safe.
#
# No secrets needed: build/test/lint all run without .env (env is read lazily).

on:
  pull_request:
  push:
    branches: [master]

# One run per ref; cancel stale runs so the latest commit is what's judged.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: brands · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Brand map in sync
        run: npm run brand:check
      - name: Lint
        run: npm run lint
      # `next build` type-checks only what it bundles, which excludes *.test.ts.
      # A widened type can therefore break the test fixtures while lint, vitest
      # and the build all stay green — that is exactly how the `restricted` flag
      # from #181 reached master. tsc over the whole tsconfig is the only check
      # that sees it, so it runs on its own here rather than being implied by
      # the build step's old "(+ typecheck)" label.
      - name: Typecheck (tsc, includes tests)
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
