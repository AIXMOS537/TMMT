# gitleaks config — used by the pre-push secret-guard (scripts/hooks/pre-push)
# and the doctor. Default rules ON; one known, handled finding is allowlisted so
# pushes aren't blocked forever by an old commit.
[extend]
useDefault = true

# KNOWN FINDING (RESOLVED): an Airtable PAT was committed in an early planning doc
# and later redacted (HEAD is clean). The value lingers in ~80 historical commits.
# VERIFIED DEAD 2026-06-22: tested the historical token against Airtable
# /v0/meta/whoami → HTTP 401 UNAUTHORIZED. It is the only token in history and it
# grants nothing — exposure is closed. Allowlisted so the guard stops blocking on
# the inert value. (A history scrub is now cosmetic; the secret is already useless.)
[allowlist]
description = "Known/redacted Airtable PAT in early-history airtable-sync plan (revoke at source)"
paths = [
  '''docs/superpowers/plans/2026-03-26-airtable-sync\.md''',
  # FALSE POSITIVE: owner readiness script uses `curl -u "$TAILSCALE_API_KEY:"` —
  # an env-var reference, NOT a hardcoded credential. No secret value is committed.
  '''scripts/partner-deploy/owner/verify-readiness\.sh''',
]
regexes = [
  '''pat[a-zA-Z0-9]{14,}\.[a-zA-Z0-9]{40,}''',
  # FALSE POSITIVE (2026-09-08): webhook test fixtures from PR #207 — `t02-ghl-…` and
  # `whsec_t02_wrong` are labelled fake secrets in *.route.test.ts. They tripped the
  # pre-push full-history scan and blocked every new branch from Carry.
  '''^(?:t02-[A-Za-z0-9_-]+|whsec_t02_[A-Za-z0-9_-]+)$''',
  '''AIRTABLE_PAT=pat[a-zA-Z0-9.]+''',
  # curl basic-auth using an env var (no literal secret)
  '''-u "\$[A-Z_]+:?"''',
  # FALSE POSITIVE: Airtable BASE ID (not a credential) hardcoded as an env fallback
  # in tmmt-os/scripts/airtable-to-supabase-migrate.mjs. Base IDs (app…) are database
  # identifiers — data access still requires the PAT (correctly env-only). Not a secret.
  '''appcenWUju039rD7b''',
  # FALSE POSITIVE: the TECHHAUS dossier documents which auth mechanism each GHL
  # webhook uses. The literal string "signature+idempotency" is a DESCRIPTION, not a
  # credential — 21 chars, all lowercase plus a '+', zero entropy. The default
  # generic-api-key rule matches any quoted value following "auth":.
  '''signature\+idempotency''',
]
