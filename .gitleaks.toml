# gitleaks config — used by the pre-push secret-guard (scripts/hooks/pre-push)
# and the doctor. Default rules ON; one known, handled finding is allowlisted so
# pushes aren't blocked forever by an old commit.
[extend]
useDefault = true

# KNOWN FINDING (handled): an Airtable PAT was committed in an early planning doc
# and later redacted (HEAD is clean). The value lingers in ~80 historical commits.
# It is allowlisted here so the guard stops blocking — BUT the real remediation is
# REVOCATION at airtable.com/create/tokens (rotate it; git scrubbing ≠ revoking).
# Tracked in docs/security/. Remove this allowlist after a full history scrub.
[allowlist]
description = "Known/redacted Airtable PAT in early-history airtable-sync plan (revoke at source)"
paths = [
  '''docs/superpowers/plans/2026-03-26-airtable-sync\.md''',
  # FALSE POSITIVE: owner readiness script uses `curl -u "$TAILSCALE_API_KEY:"` —
  # an env-var reference, NOT a hardcoded credential. No secret value is committed.
  '''scripts/partner-deploy/owner/verify-readiness\.sh''',
]
regexes = [
  '''pat[a-zA-Z0-9]{14,}\.[a-zA-Z0-9]{40,}''',
  '''AIRTABLE_PAT=pat[a-zA-Z0-9.]+''',
  # curl basic-auth using an env var (no literal secret)
  '''-u "\$[A-Z_]+:?"''',
]
